# Serves the built console and forwards /api/ to the backend service, so the browser sees
# one origin (no CORS), exactly like the Vite dev proxy (vite.config.ts).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, re-asked every 10 s: a recreated backend container gets a new
    # IP address, and a variable in proxy_pass makes Nginx look the name up again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        # No URI part after $backend: the request path (/api/v1/...) is passed unchanged.
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An investigation with a real LLM makes up to two provider calls of up to
        # SENTINEL_LLM_TIMEOUT_SECONDS (default 60) each.
        proxy_read_timeout 180s;
    }

    # Vite puts content-hashed files here: safe to cache for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/incidents/INC-0001, ...) all load index.html; React Router
    # renders the page. index.html itself is never cached, so a rebuild is picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

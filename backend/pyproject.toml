[project]
name = "cloudops-sentinel"
version = "0.1.0.dev1"
description = "AI-assisted AWS CloudOps console - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "httpx",  # one HTTP call to the LLM provider (investigation/providers only), from Day 3
]

[dependency-groups]
dev = ["pytest", "ruff"]  # httpx (needed by FastAPI's TestClient) is a runtime dependency

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

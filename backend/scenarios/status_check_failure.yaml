# The EC2 status check reports failure for the last 5 periods.
# Offsets are minutes relative to "now" (0).
id: status_check_failure
title: Status check failing
resource:
  id: sim-status-check-failure
  name: sim-batch-01
  instance_type: t3.micro
  credit_mode: standard
period_seconds: 60
history_minutes: 90
seed: 23
signals:
  cpu_utilization: { baseline: 20, noise: 3 }
  cpu_credit_balance: { baseline: 80, noise: 1 }
  memory_used: { baseline: 40, noise: 2 }
  status_check_failed:
    baseline: 0
    segments:
      - { from_min: -4, to_min: 0, value: 1 }
  request_rate: { baseline: 120, noise: 10 }
  error_rate_5xx: { baseline: 0.3, noise: 0.2 }
  latency_p95: { baseline: 180, noise: 15 }
expected:
  incident: true
  rules: [R-STATUS]
  severity: critical

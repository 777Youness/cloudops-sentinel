# Sustained CPU saturation on an otherwise normal instance.
# Offsets are minutes relative to the latest complete period ("now" = 0).
id: cpu_saturation
title: Sustained CPU saturation
resource:
  id: sim-cpu-saturation
  name: sim-api-01
  instance_type: t3.micro
  credit_mode: standard
period_seconds: 60
history_minutes: 90
seed: 7
signals:
  cpu_utilization:
    baseline: 40        # normal load
    noise: 3            # +/- uniform noise, deterministic via seed
    segments:
      - { from_min: -20, to_min: 0, value: 97 }   # last 21 datapoints saturated
expected:
  incident: true
  rules: [R-CPU-SAT]
  severity: medium
